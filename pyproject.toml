[project]
name = "fossa-mcp"
version = "0.1.0"
description = "Model Context Protocol server for FOSSA API"
authors = [
    {name = "Rick Ashford", email = "rick@theashfords.org"}
]
requires-python = ">=3.13"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "mcp[cli]>=1.28.1,<1.29",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[project.scripts]
fossa-mcp = "fossa_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
    "pyright>=1.1,<2",
]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
# Never reformat embedded code fences in Markdown — FOSSA_MCP_IMPLEMENTATION_SCOPE.md
# is a frozen requirements document, not code this project owns.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: requires a real FOSSA_API_TOKEN and network access",
]